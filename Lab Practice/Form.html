<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us Form</title>
    <link rel="stylesheet" href="F:\11th Semester\Web Tech\Lab\WTech_Spring25-26\Lab Practice\style.css">
    <script src="F:\11th Semester\Web Tech\Lab\WTech_Spring25-26\Lab Practice\script.js"></script>

</head>
<body>
    <h2>Contact us</h2>
    <div class="form-container">
    
    <form onsubmit="return validateForm()">
    <table>
        <tr>
            <td>
                <label for="firstname">FIRST NAME</label><br>
                <input type="text" id="firstname">
            </td>
            <td>
                <label for="lastname">LAST NAME</label><br>
                <input type="text" id="lastname">
            </td>
        </tr>
        <tr>    
            <td>
                <label for="email">EMAIL</label><br>
                <input type="email" id="email">
            </td>
            <td>
                <label for="phonenumber">PHONE NUMBER</label><br>
                <input type="tel" id="phonenumber">
            </td>
        </tr>  
        <tr>  
            <td colspan="2">
                <label for="message">WHAT DO YOU HAVE IN MIND</label><br>
                <textarea name="message" id="message" rows="5" cols="45" placeholder="Enter your query..."></textarea>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <input type="submit" value="submit">
            </td>
        </tr>
    </table>
    </form>
    </div>
</body>
</html>
